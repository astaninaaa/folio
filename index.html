<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Астанина — продуктовый UX/UI дизайнер с 6-летним опытом в b2b/b2c продуктах для пользователей по всему миру." />
  <title>Астанина — Продуктовый UX/UI дизайнер</title>
  <meta property="og:title" content="Астанина — Продуктовый UX/UI дизайнер" />
  <meta property="og:description" content="Астанина — продуктовый UX/UI дизайнер с 6-летним опытом в b2b/b2c продуктах для пользователей по всему миру." />
  <meta property="og:image" content="https://astaninaaa.ru/images/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,200;7..72,300;7..72,400&family=IBM+Plex+Mono:wght@200;300;400&display=swap" rel="stylesheet" />

  <!-- Preload фоновых изображений -->
  <link as="image" href="images/bg/bg-morning-birds-astaninaa.webp" />
  <link as="image" href="images/bg/bg-birds-and-street-cleaner-astaninaa.webp" />
  <link as="image" href="images/bg/bg-soloway-astaninaa.webp" />
  <link as="image" href="images/bg/bg-night-birds-astaninaa.webp" />
  <link as="image" href="images/bg/bg-raining-astaninaa.webp" />

  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/main-page.css" />
  <link rel="icon" type="image/png" href="images/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="images/favicon/favicon.svg" />
  <link rel="shortcut icon" href="images/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="images/favicon/apple-touch-icon.png" />
  <link rel="manifest" href="images/favicon/site.webmanifest" />
  <link rel="icon" media="(prefers-color-scheme: light)" href="images/favicon/favicon-light.png">
  <link rel="icon" media="(prefers-color-scheme: dark)" href="images/favicon/favicon-dark.png">
</head>

<body>
  <!-- ===== ФОНОВЫЕ СЛОИ ===== -->
  <div class="bg-layer-1"></div>
  <div class="bg-layer-2"></div>

  <!-- ===================== ШАПКА ===================== -->
  <header class="site-header" role="banner">
    <nav class="header-nav" aria-label="Разделы сайта">
      <button class="header-zone-btn header-zone-btn--craft" aria-controls="zone-craft" aria-expanded="false" aria-label="Открыть раздел Крафт">
        <img
          class="header-zone-icon"
          src="images/astaninaaa-art-h2.webp"
          alt="Арт"
          width="70" height="42"
          loading="eager" fetchpriority="high"
        />
      </button>
      <span class="header-divider" aria-hidden="true"></span>
      <a class="header-logo" href="/" aria-label="На главную страницу">
        <!-- ЗДЕСЬ ВСТАВИТЬ SVG-ЛОГОТИП (инлайн или через img) -->
        <img src="images/astaninaaa-logo.webp" alt="Ясна Астанина" loading="eager" fetchpriority="high" />
        <!-- <svg>...</svg> -->
      </a>
      <span class="header-divider" aria-hidden="true"></span>
      <button class="header-zone-btn header-zone-btn--poetry" aria-controls="zone-poetry" aria-expanded="false" aria-label="Открыть раздел Поэзия">
        <img
          class="header-zone-icon"
          src="images/astaninaaa-poetry-h2.webp"
          alt="Поэзия"
          width="100" height="42"
          loading="eager" fetchpriority="high"
        />
      </button>
    </nav>
  </header>


  <!-- ===================== ОСНОВНОЙ КОНТЕНТ ===================== -->
  <main class="site-main">

    <!-- ═══════════ ЛЕВАЯ ЗОНА — КРАФТ ═══════════ -->
    <aside id="zone-craft" class="zone zone--craft" aria-label="Крафт: рисунки и ручная работа">
      <h2 class="zone__title visually-hidden">Арт</h2>

      <div class="panel-header">
        <button class="panel-close-btn" aria-label="Закрыть панель Крафт" data-panel="craft">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="1.5"/>
            <line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <span class="panel-title">
          <img
            src="images/astaninaaa-art-h2.webp"
            alt="Арт"
            width="70" height="42"
            loading="eager"
          />
        </span>
      </div>

      <div class="craft-cards-container" id="craft-cards-container"></div>
    </aside>


    <!-- ═══════════ ЦЕНТРАЛЬНЫЙ БЛОК ═══════════ -->
    <div class="site-center" aria-label="Центральный блок">
      <h1 class="hero-title">
        <img
          class="hero-signature"
          src="images/astaninaaa-designer-sighnature.webp"
          alt="Ясна Астанина"
          width="560" height="200"
          loading="eager" fetchpriority="high"
        />
      </h1>
    </div>


    <!-- ═══════════ ПРАВАЯ ЗОНА — ПОЭЗИЯ ═══════════ -->
    <aside id="zone-poetry" class="zone zone--poetry" aria-label="Поэзия">
      <h2 class="zone__title visually-hidden">Поэзия</h2>

      <div class="panel-header">
        <button class="panel-close-btn" aria-label="Закрыть панель Поэзия" data-panel="poetry">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" aria-hidden="true">
            <line x1="4" y1="4" x2="20" y2="20" stroke="currentColor" stroke-width="1.5"/>
            <line x1="20" y1="4" x2="4" y2="20" stroke="currentColor" stroke-width="1.5"/>
          </svg>
        </button>
        <span class="panel-title">
          <img
            src="images/astaninaaa-poetry-h2.webp"
            alt="Поэзия"
            width="100" height="42"
            loading="eager"
          />
        </span>
      </div>

      <div class="poetry-cards-container" id="poetry-cards-container"></div>
    </aside>

  </main>


  <!-- ═══════════ НИЖНЯЯ ЗОНА — ПРОЕКТЫ ═══════════ -->
  <section id="zone-projects" class="zone zone--projects" aria-label="Проекты">
    <h2 class="zone-label--design">
      <img
        src="images/astaninaaa-design-h2.webp"
        alt="Дизайн"
        width="244" height="60"
        loading="eager" fetchpriority="high"
      />
    </h2>

    <!-- Контейнер заполняется JS из projects.json -->
    <div class="projects-cards-container" id="projects-cards-container"></div>
  </section>


  <!-- ═══════════ ПАНЕЛЬ ПРОЕКТА ═══════════ -->
  <div id="project-sheet" class="project-sheet" role="dialog" aria-modal="true" aria-label="Страница проекта" hidden>
    <div class="project-sheet__bar">
      <button class="project-sheet__close" aria-label="Закрыть страницу проекта">
        <svg width="32" height="20" viewBox="0 0 32 20" fill="none" aria-hidden="true">
          <path d="M2 2L16 18L30 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
    <div class="project-sheet__content" id="project-sheet-content"></div>
  </div>

  <div class="site-overlay" id="site-overlay" aria-hidden="true"></div>


  <!-- ===================== ФУТЕР ===================== -->
  <footer class="site-footer" role="contentinfo">
    <div class="footer-inner">
      <time class="footer-timer mono" id="footer-timer" aria-live="polite">--:-- +7 GMT</time>

      <!-- ПЛЕЕР -->
      <span class="footer-player mono" role="group" aria-label="Аудио плеер">

        <!-- Кнопка: Предыдущий трек -->
        <button class="winamp-btn winamp-prev" aria-label="Предыдущий трек">

          <svg class="winamp-icon" width="18" height="16" viewBox="0 0 18 16" shape-rendering="crispEdges" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 0H0V15L1 15V1L4 1V0Z" fill="#0C0431"/>
            <path d="M3 1H1V15H3V1Z" fill="#8E8EC3"/>
            <path d="M2.5 15.4287V15.5H0.5V15.4287H2.5Z" fill="#8E8EC3" stroke="#EBEBF6"/>
            <path d="M17 1H16H14.5V3H12.5V5H10V7H7.5V9H10V11H12.5V13H14.5V15H16H17V1Z" fill="#8E8EC3"/>
            <mask id="path-5-inside-1_614_20003" fill="white">
            <path d="M17 1H16V14V15H17V1Z"/>
            </mask>
            <path d="M17 1H16V14V15H17V1Z" fill="#8E8EC3"/>
            <path d="M16 1V0H15V1H16ZM17 1H18V0H17V1ZM17 15V16H18V15H17ZM16 15H15V16H16V15ZM16 1V2H17V1V0H16V1ZM17 1H16V15H17H18V1H17ZM17 15V14H16V15V16H17V15ZM16 15H17V14H16H15V15H16ZM16 14H17V1H16H15V14H16Z" fill="#EBEBF6" mask="url(#path-5-inside-1_614_20003)"/>
            <path d="M17 1H14.5V3H12.5V5H10V7H7.5V8" stroke="#0C0431"/>
            <path d="M17 15H14.5V13H12.5V11H10V9H7.5V8" stroke="#EBEBF6"/>
          </svg>








        </button>

        <!-- ОДНА КНОПКА: Воспроизведение / Пауза (переключение) -->
        <button class="winamp-btn winamp-play" id="play-pause-btn" aria-label="Воспроизвести">
          <!-- Иконка Play -->
          <svg class="winamp-icon icon-play" width="18" height="16" viewBox="0 0 18 16" shape-rendering="crispEdges" fill="none" xmlns="http://www.w3.org/2000/svg">
            <g clip-path="url(#clip0_614_20021)">
            <path d="M2 1V13.5641V15H4.69904V13.5641H7.06128V12.1282H10.0984V10.3333H12.4607V8.89744H15.8353V7.46154H12.4607V6.02564H10.0984V4.58974H7.39874V2.4359H4.69904V1H2Z" fill="#8E8EC3"/>
            <path d="M2.33008 14.5V1.5H4.47061V2.83333H7.43532V4.5H10.0706V5.83333H12.8706V7.16667H16V9.7" stroke="#0C0431"/>
            <path d="M2 14.6663H4.47059V13.3329H7.43529V11.9996H10.4V10.4998H12.8706V9.1665H16V8.5" stroke="#EBEBF6"/>
            </g>
            <defs>
            <clipPath id="clip0_614_20021">
            <rect width="18" height="16" fill="white"/>
            </clipPath>
            </defs>
          </svg>



          <!-- Иконка Pause (скрыта через CSS, а не HTML) -->
          <svg class="winamp-icon icon-pause" viewBox="0 0 18 16" shape-rendering="crispEdges" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M7 0H2V16H3V1L7 1V0Z" fill="#0C0431"/>
            <path d="M6 1H3V15H6V1Z" fill="#8E8EC3"/>
            <path d="M6.5 1.5V15.5H6.11328V1.5H6.5ZM5.11328 15.4287V15.5H3.5V15.4287H5.11328Z" fill="#8E8EC3" stroke="#EBEBF6"/>
            <path d="M16 0H11V16H12V1L16 1V0Z" fill="#0C0431"/>
            <path d="M15 1H12V15H15V1Z" fill="#8E8EC3"/>
            <path d="M15.5 1.5V15.5H15.1133V1.5H15.5ZM14.1133 15.4287V15.5H12.5V15.4287H14.1133Z" fill="#8E8EC3" stroke="#EBEBF6"/>
          </svg>



        </button>

        <!-- Кнопка: Следующий трек -->
        <button class="winamp-btn winamp-next" aria-label="Следующий трек">
          <svg class="winamp-icon" width="18" height="16" viewBox="0 0 18 16" shape-rendering="crispEdges" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M18 0H14V15L15 15V1L18 1V0Z" fill="#0C0431"/>
            <path d="M17 1H15V15H17V1Z" fill="#8E8EC3"/>
            <path d="M16.5 15.4287V15.5H14.5V15.4287H16.5Z" fill="#8E8EC3" stroke="#EBEBF6"/>
            <path d="M1 1H2H3.5V3H5.5V5H8V7H10.5V9H8V11H5.5V13H3.5V15H2H1V1Z" fill="#8E8EC3"/>
            <mask id="path-5-inside-1_614_20031" fill="white">
            <path d="M1 1H2V14V15H1V1Z"/>
            </mask>
            <path d="M2 1V0H3V1H2ZM1 1H0V0H1V1ZM1 15V16H0V15H1ZM2 15H3V16H2V15ZM2 1V2H1V1V0H2V1ZM1 1H2V15H1H0V1H1ZM1 15V14H2V15V16H1V15ZM2 15H1V14H2H3V15H2ZM2 14H1V1H2H3V14H2Z" fill="#0C0431" mask="url(#path-5-inside-1_614_20031)"/>
            <path d="M1 1H3.5V3H5.5V5H8V7H10.5V8" stroke="#0C0431"/>
            <path d="M1 15H3.5V13H5.5V11H8V9H10.5V8" stroke="#EBEBF6"/>
          </svg>



        </button>

        <!-- Кнопка: Громкость -->
        <div class="volume-wrapper">
          <button class="winamp-btn winamp-volume" id="volume-btn" aria-label="Громкость">
            <!-- Иконка включенного звука -->
            <svg class="winamp-icon icon-volume" width="18" height="16" viewBox="0 0 18 16" shape-rendering="crispEdges">
              <path d="M2 5.33333H6.28571V4H8V2.5H10.5V1L12.5 1V15H10.5V13.5H8V12H6.28571V10.6667H2V5.33333Z" fill="#8E8EC3"/>
              <path d="M2 5.5H6.4998V4H8.5V2.5H10.4998V1H13.2002" stroke="#0C0431"/>
              <path d="M2 10.5H6.5V12H8.5V13.5H10.5V15H12" stroke="#EBEBF6"/>
              <mask id="path-4-inside-1_618_2061" fill="white">
              <path d="M1 5H2V10.5714V11H1V5Z"/>
              </mask>
              <path d="M2 5V4H3V5H2ZM1 5H0V4H1V5ZM1 11V12H0V11H1ZM2 11H3V12H2V11ZM2 5V6H1V5V4H2V5ZM1 5H2V11H1H0V5H1ZM1 11V10H2V11V12H1V11ZM2 11H1V10.5714H2H3V11H2ZM2 10.5714H1V5H2H3V10.5714H2Z" fill="#0C0431" mask="url(#path-4-inside-1_618_2061)"/>
              <path d="M12.0002 1.5H13.2002V14.5V15.5H12.0002V1.5Z" fill="#EBEBF6"/>
            </svg>



            <!-- Иконка выключенного звука -->
            <svg class="winamp-icon icon-mute" width="18" height="16" viewBox="0 0 18 16" shape-rendering="crispEdges" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M1 5.33333H5.28571V4H7V2.5H9.5V1L11.5 1V15H9.5V13.5H7V12H5.28571V10.6667H1V5.33333Z" fill="#8E8EC3"/>
              <path d="M1.0002 5.5H5.5V4H7.5002V2.5H9.5V1H12" stroke="#0C0431"/>
              <path d="M1 10.5H5.5V12H7.5V13.5H9.5V15H11" stroke="#EBEBF6"/>
              <mask id="path-4-inside-1_618_2089" fill="white">
              <path d="M1 5H2V10.5714V11H1V5Z"/>
              </mask>
              <path d="M2 5V4H3V5H2ZM1 5H0V4H1V5ZM1 11V12H0V11H1ZM2 11H3V12H2V11ZM2 5V6H1V5V4H2V5ZM1 5H2V11H1H0V5H1ZM1 11V10H2V11V12H1V11ZM2 11H1V10.5714H2H3V11H2ZM2 10.5714H1V5H2H3V10.5714H2Z" fill="#0C0431" mask="url(#path-4-inside-1_618_2089)"/>
              <path d="M10.8 1.5H12V14.5V15.5H10.8V1.5Z" fill="#EBEBF6"/>
              <path d="M10.4193 4.48325L9 5.90259L14.9453 11.8479L15.4907 11.3024L10.4737 6.28534L11.3475 5.41146L10.4193 4.48325Z" fill="#0C0431"/>
              <path d="M11.3484 5.41117L10.4258 6.33374L15.0668 10.9748L15.9894 10.0522L11.3484 5.41117Z" fill="#8E8EC3"/>
              <path d="M15.9886 10.7595L16.2102 10.9811L15.4983 11.6931L15.2766 11.4714L15.9886 10.7595Z" fill="#8E8EC3" stroke="#EBEBF6"/>
              <path d="M9.48105 10.9789L10.9004 12.3982L16.8457 6.45291L16.3002 5.90745L11.2831 10.9245L10.4093 10.0506L9.48105 10.9789Z" fill="#0C0431"/>
              <path d="M10.4095 10.0501L11.332 10.9727L15.9731 6.33162L15.0505 5.40905L10.4095 10.0501Z" fill="#8E8EC3"/>
              <path d="M15.758 5.40936L15.9797 5.1877L16.6916 5.89964L16.4699 6.1213L15.758 5.40936Z" fill="#8E8EC3" stroke="#EBEBF6"/>
            </svg>







          </button>
          <div class="volume-slider-container">
            <input type="range" class="volume-slider" id="volume-slider" min="0" max="100" value="50" aria-label="Регулировка громкости">
          </div>
        </div>

        <!-- Обертка для списка -->
        <div class="playlist-wrapper" id="playlist-wrapper">
          <button class="winamp-btn winamp-playlist" id="playlist-btn" aria-label="Открыть список треков">
            <svg width="18" height="16" viewBox="0 0 18 16" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M2 4.99994L2 2L16 2L16 2.99995L3.4 2.99998L3.4 4.99994L2 4.99994Z" fill="#0C0431"/>
              <path d="M16 5L16 3L3 3L3 5L16 5Z" fill="#8E8EC3"/>
              <path d="M2 9.49994L2 6.5L16 6.5L16 7.49995L3.4 7.49998L3.4 9.49994L2 9.49994Z" fill="#0C0431"/>
              <path d="M16 9.5L16 7.5L3 7.5L3 9.5L16 9.5Z" fill="#8E8EC3"/>
              <path d="M2 13.9999L2 11L16 11L16 11.9999L3.4 12L3.4 13.9999L2 13.9999Z" fill="#0C0431"/>
              <path d="M16 14L16 12L3 12L3 14L16 14Z" fill="#8E8EC3"/>
            </svg>

          </button>
          
          <!-- Сама плашка с треками -->
          <div class="playlist-container" id="playlist-container">
            <div class="playlist-header">Плейлист</div>
            <ul class="playlist-items"></ul>
          </div>
        </div>

        <!-- Микро-подсказка ошибки -->
        <div id="player-error" class="player-error mono" aria-live="polite" hidden></div>

        <!-- Скрытый аудиоэлемент -->
        <audio id="player-audio" preload="metadata"></audio>

      </span>

      <nav class="footer-contacts" aria-label="Copyright">
        <p class="footer-copyright">&copy;&nbsp;Астанина, 2026</p>
      </nav>
    </div>
  </footer>

  <script src="js/global.js"></script>
  <script src="js/main-page.js"></script>
</body>
</html>
